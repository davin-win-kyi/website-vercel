<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // The theme the visitor picked with the toggle, or else their device's light/dark setting.
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "dark" || (!theme && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
    <title>Davin Kyi</title>
    <meta
      name="description"
      content="Davin Kyi — M.S. Computer Science & Engineering student at the University of Washington researching AR, accessibility, and machine learning."
    />
    <meta name="author" content="Davin Kyi" />
    <!-- Lets Google show large previews of the site's photos in search results. -->
    <meta name="robots" content="max-image-preview:large" />
    <!-- Proves ownership of the site to Google Search Console. Keep it, or Search Console stops
         treating the site as yours. -->
    <meta name="google-site-verification" content="MqaTPWeIJpATO81seZ_j5tW2uemdAHj_vhQfPKBhPW4" />

    <meta property="og:title" content="Davin Kyi" />
    <meta
      property="og:description"
      content="M.S. Computer Science student at the University of Washington researching AR, accessibility, and machine learning."
    />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Davin Kyi" />
    <meta
      name="twitter:description"
      content="M.S. Computer Science student at the University of Washington researching AR, accessibility, and machine learning."
    />

    <!-- The site icon, for browser tabs, bookmarks, search results and phone home screens. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>

  </body>
</html>
